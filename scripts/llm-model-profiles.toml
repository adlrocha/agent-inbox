# Model sampling profiles shipped with nibble.
#
# This file is committed to the repo and pulled by `nibble lm use` automatically
# (it is located next to setup-llama-server.sh). You normally do NOT need to copy
# anything to your model directory — just `git pull` to get new/updated profiles.
#
# A host can still drop a `profiles.toml` in its model directory to override these
# field-by-field (e.g. tweak sampling locally without editing this tracked file).
# See llm-model-profiles.example.toml for that.
#
# Each section header is matched case-insensitively as a substring of the .gguf
# filename. All fields are optional — omitted values fall back to the script
# defaults (temp=0.6, top_p=0.95, top_k=40, min_p=0.05, mtp=auto, think=false).
# When multiple sections match a filename, later sections override earlier ones
# field-by-field, so put more specific sections lower.

# Gemma 4 — recommended sampling from Unsloth HF page
[gemma-4]
temp  = 1.0
top_p = 0.95
top_k = 64
mtp   = false

# Gemma 4 12B Coder (fable5-composer) — CoT-trained, ships with thinking on.
# Both [gemma-4] and this match the filename; keep it below so think=true wins.
[gemma-4-12b-coder]
temp  = 1.0
top_p = 0.95
top_k = 64
mtp   = false
think = true

# Qwen3 MTP models — default nibble settings
[qwen3]
temp  = 0.6
top_p = 0.95
top_k = 40
min_p = 0.05
mtp   = true
