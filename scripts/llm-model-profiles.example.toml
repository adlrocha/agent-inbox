# OPTIONAL host-local profile overrides for `nibble lm use`.
#
# You usually do NOT need this file. The committed `llm-model-profiles.toml`
# in this repo is pulled automatically and covers the common models.
#
# Use this only to override the repo profiles on a specific host without editing
# the tracked file. Copy it to your model directory as `profiles.toml`
# (e.g. ~/workspace/llm-models/profiles.toml). Fields set here win over the
# repo defaults; fields you omit fall back to the repo profile, then to the
# script defaults (temp=0.6, top_p=0.95, top_k=40, min_p=0.05, mtp=auto,
# think=false).
#
# Section headers match case-insensitively as a substring of the .gguf filename.

# Example: run Gemma 4 deterministically on this host only.
[gemma-4]
temp = 0.0
